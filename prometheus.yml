global:
  scrape_interval:     30s # Low request volume; 30s is plenty and keeps storage small.

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: 'railway-prom'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'backend'
    scrape_interval: 30s
    static_configs:
      - targets: ['backend.railway.internal:8081']

  - job_name: 'availability_sync'
    scrape_interval: 30s
    static_configs:
      - targets: ['37.27.2.66:8081']
